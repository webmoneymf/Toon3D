/* Toon3D Studio — тёмная тема интерфейса */
:root {
  --bg: #14161d; --panel: #1b1f2a; --panel2: #232838; --line: #2e3446;
  --text: #e8ebf5; --muted: #8b93ab; --accent: #ff7a45; --accent2: #5cc8ff; --key: #ffd23f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
body { display: grid; grid-template-rows: 48px minmax(180px, 1fr) 250px 100px; height: 100vh; }

button, select, input { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent2); }
button.active { background: #2d4a63; border-color: var(--accent2); }
button.primary { background: var(--accent); border-color: var(--accent); color: #1a1008; font-weight: 700; }
button:disabled { opacity: .4; cursor: default; }
select, input[type=text], input[type=number] { background: #11141c; border: 1px solid var(--line);
  border-radius: 5px; padding: 3px 6px; }
input[type=color] { width: 38px; height: 24px; padding: 0; border: 1px solid var(--line);
  background: none; border-radius: 4px; }
label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }

#topbar { display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--panel);
  border-bottom: 1px solid var(--line); overflow-x: auto; white-space: nowrap; }
#topbar .logo { font-size: 16px; font-weight: 600; margin-right: 6px; }
#topbar .logo b { color: var(--accent); }
#topbar .group { display: flex; align-items: center; gap: 6px; }
#topbar .spacer { flex: 1; }

#workspace { display: grid; grid-template-columns: 230px 1fr 260px; min-height: 0; }
#library, #props { background: var(--panel); overflow-y: auto; padding: 10px; }
#library { border-right: 1px solid var(--line); }
#props { border-left: 1px solid var(--line); }
h4 { margin: 12px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h4:first-child { margin-top: 0; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn-grid button { text-align: left; }
.hint { color: var(--muted); font-size: 12px; }
.keys { color: var(--muted); font-size: 12px; line-height: 1.7; }
.keys kbd { background: #11141c; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

.outliner { display: flex; flex-direction: column; gap: 3px; max-height: 220px; overflow-y: auto; }
.outliner .item { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 5px;
  cursor: pointer; background: var(--panel2); }
.outliner .item.sel { outline: 1px solid var(--accent2); }
.outliner .item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.outliner .eye { background: none; border: none; padding: 0 2px; }

#viewport { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0;
  background: #0d0f14; overflow: hidden; }
#canvasWrap { position: relative; box-shadow: 0 0 0 1px var(--line), 0 10px 40px #000a; }
#stage { display: block; touch-action: none; }
#safeZones { position: absolute; inset: 0; pointer-events: none; }
#safeZones .sz { position: absolute; background: #ff3b3b33; border: 1px dashed #ff6b6b; color: #ffbcbc;
  font-size: 10px; display: flex; align-items: center; justify-content: center; text-align: center; }
#safeZones .top { left: 0; right: 0; top: 0; height: 9%; }
#safeZones .bottom { left: 0; right: 0; bottom: 0; height: 22%; }
#safeZones .right { right: 0; top: 55%; width: 16%; height: 23%; }

.field { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
.field > span { width: 78px; color: var(--muted); flex: none; }
.field input[type=number] { width: 54px; }
.field input[type=text], .field select { flex: 1; min-width: 0; }
.row-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

/* Таймлайн */
#timeline { background: var(--panel); border-top: 1px solid var(--line); display: flex;
  flex-direction: column; min-height: 0; }
.tl-bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line);
  flex-wrap: wrap; }
.tl-bar .sep { width: 1px; height: 20px; background: var(--line); }
.tl-bar input[type=number] { width: 52px; }
.tl-time { font-variant-numeric: tabular-nums; min-width: 120px; }
.tl-scroll { flex: 1; overflow: auto; min-height: 0; }
#tlBody { position: relative; min-height: 100%; }
.tl-row { display: flex; height: 24px; border-bottom: 1px solid #252a3a; }
.tl-row.head { background: #202537; }
.tl-label { position: sticky; left: 0; z-index: 5; width: 150px; flex: none; background: var(--panel);
  padding: 3px 8px; border-right: 1px solid var(--line); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.tl-row.head .tl-label { background: #202537; font-weight: 600; }
.tl-row .sub { padding-left: 20px; color: var(--muted); }
.tl-lane { position: relative; flex: none; }
.tl-ruler .tl-lane { cursor: ew-resize; background: #161a25; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid #353c52; font-size: 10px;
  color: var(--muted); padding-left: 3px; pointer-events: none; }
.key { position: absolute; top: 6px; width: 11px; height: 11px; margin-left: -6px; background: var(--key);
  transform: rotate(45deg); border: 1px solid #5a4500; cursor: grab; z-index: 2; }
.key.sel { background: #fff; border-color: var(--accent); }
.tl-head { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff4d6d; pointer-events: none; z-index: 4; }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 20px; width: 380px; }
dialog::backdrop { background: #000a; }
dialog h3 { margin: 0 0 10px; }
dialog progress { width: 100%; margin-top: 8px; }
.dlg-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

#toast { position: fixed; left: 50%; bottom: 270px; transform: translateX(-50%); background: #000d;
  border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; z-index: 20; }
#fatal { position: fixed; inset: 0; background: #14161df5; z-index: 99; padding: 40px; }
#fatal h2 { color: var(--accent); }

@media (max-width: 900px) {
  #workspace { grid-template-columns: 1fr; }
  #library, #props { display: none; }
}

/* Дорожки экранного текста */
.ov-bar { position: absolute; top: 3px; height: 18px; background: #5b3a7a; border: 1px solid #a77bd1; border-radius: 4px;

.ov-bar.sel { background: #8a4fc0; border-color: #fff; }
.ov-form { margin-top: 8px; }

/* Вкладки левой панели */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.tabs button { flex: 1 1 28%; padding: 6px 4px; font-size: 12px; }
.pane[hidden] { display: none; }
.btn-grid.one { grid-template-columns: 1fr; }
.btn-grid button.active, button.wide.active { background: #2d4a63; border-color: var(--accent2); }
button.wide { width: 100%; margin-bottom: 6px; text-align: left; }
.btn-grid button { padding: 8px 10px; }
.tl-bar .spacer { flex: 1; }
.key-btn { background: #3a3320; border-color: var(--key); color: var(--key); font-weight: 600; }
#tlRec.rec { background: #b03a2e; border-color: #ff6b5a; color: #fff; }
.tl-time { min-width: 90px; }

#yandex-ad-area { display: flex; align-items: center; justify-content: center; min-height: 100px; padding: 4px 12px; background: var(--panel); border-top: 1px solid var(--line); overflow: auto; }
#yandex-ad-area > div { max-width: 100%; }
